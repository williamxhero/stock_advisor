[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-memory-hub"
version = "0.2.0"
description = "Independent immutable memory authority for AI trading companions"
requires-python = ">=3.11"

[project.scripts]
memoryhub = "trading_memory_hub.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trading_memory_hub.admin" = ["*.html", "*.css", "*.js"]
