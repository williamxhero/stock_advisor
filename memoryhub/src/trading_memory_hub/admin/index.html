<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoryHub · 只读管理</title><link rel="stylesheet" href="/admin/assets/admin.css"></head><body>
<header><strong>MemoryHub</strong><span>只读记忆管理</span><i id="health">连接中</i></header><main>
<aside><h1>记忆空间</h1><nav id="spaces" aria-label="记忆空间"></nav></aside>
<section><div class="section-head"><h2 id="space-title">选择记忆空间</h2><span id="count"></span></div><form id="filters"><input name="q" aria-label="搜索记忆" placeholder="搜索正文或索引"><select name="episode_type" aria-label="记忆类型"><option value="">全部类型</option><option>user_message</option><option>ai_message</option><option>ai_candidate</option></select><select name="derivation_state" aria-label="派生状态"><option value="">全部派生状态</option><option>pending</option><option>complete</option><option>failed</option></select><button>筛选</button><button type="button" id="timeline">消息时间线</button><a id="download">下载 JSON</a></form><div id="episodes" class="episodes"></div><button id="more" hidden>加载更多</button></section>
<article id="detail"><p class="empty">选择一条记忆查看不可变详情</p></article></main><script src="/admin/assets/admin.js" defer></script></body></html>
